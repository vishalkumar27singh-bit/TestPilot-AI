<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Page with a console error</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="style.css"></head>
<body><main><h1>Console error demo</h1><p>This page logs an error and throws an uncaught exception during load. It has enough ordinary text content to avoid being treated as an empty application shell by the analyzer.</p></main>
<script>console.error("sample console error"); throw new Error("uncaught sample error");</script></body></html>
