<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TestPilot AI</title>
  <meta name="description" content="Automated UI, API, and responsive website testing agent.">
  <style>
    :root { color-scheme: light; --ink:#0f1623; --accent:#2f4bff; --canvas:#f4f3ee; --muted:#5b6372; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--canvas); color:var(--ink); }
    main { min-height:100vh; display:grid; place-items:center; padding:24px; }
    article { width:min(760px, 100%); background:white; border:1px solid #e2e0d8; border-radius:20px; padding:48px; box-shadow:0 18px 50px rgba(15,22,35,.08); }
    .mark { width:48px; height:48px; display:grid; place-items:center; border-radius:13px; background:var(--accent); color:white; font-size:26px; font-weight:700; }
    h1 { margin:24px 0 10px; font-size:clamp(38px,7vw,64px); line-height:1; letter-spacing:-.04em; }
    p { color:var(--muted); font-size:18px; line-height:1.65; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; }
    a { display:inline-block; text-decoration:none; border-radius:10px; padding:12px 16px; font-weight:700; }
    .primary { background:var(--accent); color:white; }
    .secondary { border:1px solid #d8d5ca; color:var(--ink); background:white; }
  </style>
</head>
<body>
  <main>
    <article>
      <div class="mark" aria-hidden="true">&#10003;</div>
      <h1>TestPilot AI</h1>
      <p>An automated testing agent for UI, API, link, responsive, and visual checks. TestPilot is a Streamlit application and must run on a Python-capable host.</p>
      <div class="actions">
        <a class="primary" href="../README.md">Read setup guide</a>
        <a class="secondary" href="../">View repository</a>
      </div>
    </article>
  </main>
</body>
</html>
